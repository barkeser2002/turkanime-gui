<!DOCTYPE html>
<html lang="tr">
<head>
<title>Animeler Pw | 404 Sayfa Bulunamadı</title>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="error-container">
        <div class="error-code-wrapper">
            <h1 class="error-code">404</h1>
            <div class="nani-text">NANI?!</div>
        </div>
        
        <h2 class="error-message">Kayboldun mu Kahraman?</h2>
        
        <p class="error-description">
            Aradığın sayfa başka bir evrene (Isekai) ışınlanmış olabilir ya da hiç var olmadı. 
            Görünüşe göre bir "Error" büyüsüne yakalandın!
        </p>
        
        <a href="https://animeler.pw" class="cmn-btn">
            Geri Dönüş Kapısı
        </a>

        
        <div class="mascot-wrapper mt-4">
            <img src="https://animeler.pw/assets/errors/images/anime-404-mascot.png" 
                 class="mascot-main" 
                 alt="404 mascot"
                 onerror="this.src='https://animeler.pw/assets/errors/images/error-404.png'; this.className='anime-character-legacy';">
        </div>
    </div>

    

</body>
</html>
