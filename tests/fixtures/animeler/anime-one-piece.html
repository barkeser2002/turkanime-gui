                    if (s < 1 && e < 1) return rStart <= 1;

gridHtml += '<a href="' + ep.url + '" class="ep-item' + (i === 0 ? ' active' : '') + '" data-ep-id="' + (ep.id || '') + '" data-ep-num="' + ep.start + '"' + (ep.title ? ' data-episode-title="' + (ep.title || '').replace(/"/g, '&quot;') + '"' : '') + '>' + ep.display + (ep.title ? '<span class="ep-title-sr" aria-hidden="true">' + (ep.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span>' : '') + '</a>';

            grid.innerHTML = gridHtml;
            if (listEl) listEl.innerHTML = listHtml;

                window.applyWatchedStyles();

        function applyInitialEpisodeRange() {
            var grid = document.getElementById('episodeGrid');
            if (!grid) return;
            var pp = parseInt(grid.getAttribute('data-per-page'), 10);
            if (pp > 0) perPage = pp;
            var sid = grid.getAttribute('data-season-id');
            var seasonId = (sid === '' || sid === null || sid === undefined) ? null : sid;
            if (seasonId !== null && typeof seasonEpisodesData !== 'undefined' && !seasonEpisodesData[seasonId]) return;
            if (seasonId === null && (!window.allEpisodesData || allEpisodesData.length === 0)) return;
            currentPage = 0;
            var select = document.getElementById('epRangeSelect');
            if (select) select.value = '0';
            changeEpisodeRange(0, seasonId);
        }
        (function initDetailEpisodeRange() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    setTimeout(applyInitialEpisodeRange, 0);
                });
            } else {
                setTimeout(applyInitialEpisodeRange, 0);
            }
        })();

        window.navigateEpisodePage = function(dir) {
            const select = document.getElementById('epRangeSelect');
            if (!select) return;

            const currentVal = parseInt(select.value);
            const maxVal = select.options.length - 1;

            if (dir === 'prev' && currentVal > 0) {
                select.value = currentVal - 1;
                $(select).trigger('change');
            } else if (dir === 'next' && currentVal < maxVal) {
                select.value = currentVal + 1;
                $(select).trigger('change');
            }
        }

        window.goToEpisodeNumber = function(seasonId) {
            const input = document.querySelector('.ep-search-input');
            if (!input) return;

            const num = parseInt(input.value, 10);
            if (num <= 0) return;

            var maxEp = parseInt(input.getAttribute('data-max'), 10) || 0;
            if (maxEp && num > maxEp) {
                alert('Geçersiz bölüm numarası (1-' + maxEp + ')');
                return;
            }

            let eps;
            if (seasonId !== null && seasonEpisodesData[seasonId]) {
                eps = seasonEpisodesData[seasonId];
            } else {
                eps = allEpisodesData;
            }
            if (!eps || eps.length === 0) return;

            var found = eps.find(function(ep) {
                var start = ep.start || 0;
                var end = ep.end || start;
                return num >= start && num <= end;
            });
            if (found) {
                window.location.href = found.url;
            } else {
                var byStart = eps.find(function(ep) { return (ep.start || 0) >= num; });
                window.location.href = (byStart || eps[eps.length - 1]).url;
            }
        }

        window.searchEpisode = function() {
            window.goToEpisodeNumber(null);
        }

        window.searchEpisodeInSeason = function(seasonId) {
            const input = document.querySelector(`.ep-search-input[data-season-id="${seasonId}"]`) || document.querySelector('.ep-search-input');
            if (!input) return;
            const num = parseInt(input.value);
            if (num > 0) {
                const items = document.querySelectorAll('.ep-item');
                if (num <= items.length) {
                    window.location.href = items[num - 1].href;
                }
            }
        }

        window.toggleAllCharacters = function() {
            const moreChars = document.getElementById('moreCharacters');
            const btnText = document.getElementById('charBtnText');
            const btnIcon = document.getElementById('charBtnIcon');

            if (moreChars.classList.contains('d-none')) {
                moreChars.classList.remove('d-none');
                btnText.textContent = 'Daha Az Göster';
                btnIcon.classList.replace('fa-chevron-down', 'fa-chevron-up');
            } else {
                moreChars.classList.add('d-none');
                btnText.textContent = 'Tüm Karakterleri Göster (1472)';
                btnIcon.classList.replace('fa-chevron-up', 'fa-chevron-down');
            }
        }
