            var embedSrc = iframe.getAttribute('data-src') || iframe.src;
            var maxRetries = 3;
            var retryCount = 0;
            var loadTimeout;

            function startWait() {

                    if (retryCount >= maxRetries) return;
                    retryCount++;
                    iframe.src = '';
                    iframe.src = embedSrc;
                    startWait();
                }, 5000);
            }

            iframe.onload = function() { clearTimeout(loadTimeout); };
