version: '3.8'

services:
  turkanime-api:
    build:
      context: ..               # repo köküyle build et — turkanime_api da gerekli
      dockerfile: turkanime_server/Dockerfile
    container_name: turkanime-api
    ports:
      - "34665:34665"
    environment:
      PORT: "34665"
      DEBUG: "false"
      DB_HOST: "${DB_HOST:-ip.bariskeser.com}"
      DB_USER: "${DB_USER:-turkanime-gui}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      DB_NAME: "${DB_NAME:-turkanime-gui}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:34665/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - turkanime-net

  # Arka plan arşiv tarayıcısı (Faz 11). API ile aynı imajı kullanır; tek farkı
  # komutu. Bilerek `restart: on-failure` değil `no`: her tur kuyrukta hazır ne
  # varsa işleyip çıkar, tekrar başlatmayı cron/systemd'ye bırakır. Sonsuz
  # döngüde çalıştırmak nezaket tavanlarını anlamsızlaştırırdı.
  turkanime-crawler:
    build:
      context: ..
      dockerfile: turkanime_server/Dockerfile
    container_name: turkanime-crawler
    command: >
      python -m turkanime_server.crawler
      --cikti /veri/arsiv
      --durum /veri/durum/tarayici.sqlite3
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - turkanime-arsiv:/veri
    restart: "no"
    profiles: ["crawler"]
    networks:
      - turkanime-net

  # Arşiv yayıncısı (Faz 12). Tarayıcıyla aynı birimi okur, arşivi git'e işler.
  # Ayrı servis, çünkü ayrı ritim: tarama saatler sürer, yayın saniyeler. Tipik
  # akış tek satır — önce tara, sonra yayınla:
  #   docker compose --profile crawler run --rm turkanime-crawler \
  #     && docker compose --profile yayin run --rm turkanime-yayinci
  # Sırlar `.env` dosyasından gelir (bkz. .env.example); compose dosyasına
  # token yazılmaz.
  turkanime-yayinci:
    build:
      context: ..
      dockerfile: turkanime_server/Dockerfile
    container_name: turkanime-yayinci
    command: >
      python -m turkanime_server.yayinci
      --arsiv /veri/arsiv
    working_dir: /app
    # Değerler compose'un kendiliğinden okuduğu `.env` dosyasından gelir;
    # `env_file:` kullanılmıyor çünkü dosya yoksa compose hata verir ve
    # `--kuru-calistir` denemesi bile mümkün olmaz.
    environment:
      PYTHONUNBUFFERED: "1"
      TURKANIME_ARSIV_UZAK: "${TURKANIME_ARSIV_UZAK:-}"
      TURKANIME_ARSIV_DAL: "${TURKANIME_ARSIV_DAL:-master}"
      TURKANIME_ARSIV_TOKEN: "${TURKANIME_ARSIV_TOKEN:-}"
      TURKANIME_ARSIV_KULLANICI: "${TURKANIME_ARSIV_KULLANICI:-oauth2}"
      TURKANIME_ARSIV_SSH_ANAHTAR: "${TURKANIME_ARSIV_SSH_ANAHTAR:-}"
      TURKANIME_ARSIV_AD: "${TURKANIME_ARSIV_AD:-turkanime-arsiv}"
      TURKANIME_ARSIV_EPOSTA: "${TURKANIME_ARSIV_EPOSTA:-turkanime-arsiv@users.noreply.localhost}"
      TURKANIME_ARSIV_AZAMI_GECMIS: "${TURKANIME_ARSIV_AZAMI_GECMIS:-200}"
      TURKANIME_ARSIV_BAKIM_ARALIGI: "${TURKANIME_ARSIV_BAKIM_ARALIGI:-25}"
    volumes:
      - turkanime-arsiv:/veri
      # SSH ile itiliyorsa anahtarı salt-okunur bağlayın ve .env içinde
      # TURKANIME_ARSIV_SSH_ANAHTAR=/sirlar/arsiv_ed25519 verin.
      #- ./sirlar:/sirlar:ro
    restart: "no"
    profiles: ["yayin"]
    networks:
      - turkanime-net

volumes:
  turkanime-arsiv:

networks:
  turkanime-net:
    driver: bridge
