[tool.poetry]
name = "turkanime-gui"
version = "9.4.12.2"
description = "Türkanime video oynatıcı ve indirici"
authors = ["barkeser2002 <bariskeser@bariskeser.com>", "Junicchi <junicchi@waifu.club>"]
readme = "README.md"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/barkeser2002/turkanime-gui"
keywords = ["turkanime","turk","anime","downloader"]

classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

packages = [
  { include = "turkanime_api" }
]

include = [
    { path = "docs/TurkAnime.png", format = "sdist" },
    { path = "docs/TurkAnime.ico", format = "sdist" },
    { path = "docs/TurkAnime.png", format = "wheel" },
    { path = "docs/TurkAnime.ico", format = "wheel" },
]

[tool.poetry.dependencies]
python = ">=3.9,<4"
yt-dlp = { version = "*", extras = ["default", "curl-cffi"] }
curl-cffi = ">=0.13"
pycryptodome = "*"
appdirs = "*"
questionary = "*"
py7zr = "*"
rich = ">=13.0.0"
easygui = ">=0.98.2"
beautifulsoup4 = "*"
requests = "*"
# Yeni Qt GUI'si PySide6 (LGPL) üzerine kuruluyor; QtWebEngine cookie/CF akışı
# için gerekli. Opsiyonel tutuluyor, GUI isteyenler extras ile kurar.
pyside6 = { version = ">=6.7", optional = true }
# NOT: customtkinter + selenium, CTk->Qt geçişi tamamlanana kadar korunuyor
# (eski GUI çalışır kalsın). Geçiş bittiğinde (A5) kaldırılacak.
customtkinter = { version = ">=5.2.0", optional = true }

selenium = { version = ">=4.11.0", optional = true }

[tool.poetry.extras]
gui = ["pyside6", "customtkinter", "selenium"]

[tool.poetry.group.dev.dependencies]
toml = "*"
pytest = ">=8.0"
pytest-qt = ">=4.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# adapters-test-all.py bir pytest paketi değil, elle çalıştırılan ağ betiği.
# NOT: buraya `-q` KOYMA — komut satırında da `-q` verilince `-qq` olur ve
# pytest özet satırını ("N passed") hiç basmaz; doğrulama körleşir.
addopts = "--ignore=tests/adapters-test-all.py"
markers = [
    "network: gerçek ağ erişimi gerektirir (varsayılan olarak atlanır; --network ile çalıştır)",
]

[tool.pylint.main]
# PySide6 derlenmiş bir C++ eklentisi; pylint onu statik olarak inceleyemediği
# için her Qt importuna "No name 'QWidget' in module" (E0611) yanlış pozitifi
# üretiyordu. CI `pylint -E` koştuğundan bu, gerçek hataları gürültüde boğuyor.
# Allow-list, pylint'in modülü gerçekten yükleyip incelemesini sağlar.
extension-pkg-allow-list = ["PySide6"]
ignored-modules = ["py7zr"]

[tool.pylint.typecheck]
# Qt sinyalleri (clicked, textChanged, özel Signal'ler) metaclass tarafından
# üretildiği için pylint bunlarda `.connect/.emit/.disconnect` üyesini göremiyor
# ve E1101 yanlış pozitifi veriyor. Yalnızca bu üç üye adı muaf tutuluyor —
# gerçek `no-member` hataları yakalanmaya devam eder.
generated-members = ["connect", "emit", "disconnect"]

[tool.poetry.scripts]
# Publish sırasında yapılması gerekenler:
#   turkanime_api/version.py dosyasındaki build, pip olarak değişmeli.
#   poetry build; poetry install; poetry publish

turkanime = 'turkanime_api.cli.__main__:main'
turkanime-cli = 'turkanime_api.cli.__main__:main'
# Geçiş dönemi yönlendiricisi: varsayılan eski CustomTkinter GUI'si,
# `TURKANIME_QT=1` ile yeni Qt GUI'si. Geçiş tamamlanınca (Faz 9) doğrudan
# `turkanime_api.gui.qt:run`'a bağlanacak.
turkanime-gui = 'turkanime_api.gui.boot:main'
# Yeni PySide6 + QtWebEngine GUI'si (doğrudan giriş)
turkanime-qt = 'turkanime_api.gui.qt:run'
