on: [pull_request, push]
name: Hata kontrolü ve lint
jobs:
  lint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then grep -v py7zr requirements.txt > req2.txt && pip install -r req2.txt; fi
          if [ -f requirements-gui.txt ]; then pip install -r requirements-gui.txt; else pip install PyQt6; fi
          pip install pylint
      - name: Run pylint (critical errors only)
        shell: bash
        run: |
          shopt -s globstar
          pylint --ignored-modules py7zr -E **/*.py || true
      - name: Run pylint (package critical issues)
        shell: bash
        run: |
          pylint --ignored-modules py7zr turkanime_api/ || true
      - name: Run pylint (duplicate code check)
        shell: bash
        run: |
          if [ -f turkanime.py ]; then pylint --ignored-modules py7zr turkanime.py --disable=all --enable=duplicate-code || true; fi

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # QtWebEngine (Chromium) başsız ortamda bu sistem kütüphanelerini ister;
      # eksikse PySide6 importu değil, ilk sayfa yüklemesi sessizce başarısız olur.
      - name: Qt sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2t64 libegl1 libgl1 libxcursor1 libxi6
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          grep -v py7zr requirements.txt > req2.txt && pip install -r req2.txt
          pip install PySide6 pytest pytest-qt
      - name: pytest (ağ testleri hariç)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/
